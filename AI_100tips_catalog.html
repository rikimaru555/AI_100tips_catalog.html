<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI活用100本ノック — DeNA</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --white: #FFFFFF;
            --off-white: #FAFAFA;
            --gray-100: #F5F5F5;
            --gray-200: #E5E5E5;
            --gray-400: #A3A3A3;
            --gray-600: #525252;
            --black: #0A0A0A;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html {
            font-size: 15px;
            -webkit-font-smoothing: antialiased;
        }
        
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background: var(--white);
            color: var(--black);
            line-height: 1.6;
            font-weight: 400;
        }
        
        .en { font-family: 'DM Sans', sans-serif; }
        
        /* Hero */
        .hero {
            min-height: 100vh;
            display: grid;
            grid-template-rows: auto 1fr auto;
            padding: 32px 48px;
            border-bottom: 1px solid var(--gray-200);
        }
        
        .hero-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .hero-top span {
            font-size: 11px;
            letter-spacing: 0.12em;
            color: var(--gray-600);
            text-transform: uppercase;
        }
        
        .hero-center {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            gap: 24px;
        }
        
        .hero-label {
            font-size: 11px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--gray-400);
        }
        
        .hero-title {
            font-size: clamp(48px, 10vw, 120px);
            font-weight: 300;
            letter-spacing: -0.03em;
            line-height: 0.95;
        }
        
        .hero-sub {
            font-size: 14px;
            color: var(--gray-600);
            max-width: 400px;
            line-height: 1.8;
        }
        
        .hero-bottom {
            display: flex;
            justify-content: center;
            gap: 64px;
        }
        
        .stat {
            text-align: center;
        }
        
        .stat-num {
            font-size: 48px;
            font-weight: 300;
            letter-spacing: -0.02em;
            line-height: 1;
        }
        
        .stat-label {
            font-size: 10px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--gray-400);
            margin-top: 8px;
        }
        
        /* Controls */
        .controls {
            display: grid;
            grid-template-columns: 280px 1fr;
            border-bottom: 1px solid var(--gray-200);
        }
        
        .search-box {
            padding: 24px 32px;
            border-right: 1px solid var(--gray-200);
        }
        
        .search-input {
            width: 100%;
            padding: 12px 0;
            border: none;
            border-bottom: 1px solid var(--gray-200);
            background: transparent;
            font-family: inherit;
            font-size: 13px;
            color: var(--black);
            outline: none;
            transition: border-color 0.2s;
        }
        
        .search-input::placeholder { color: var(--gray-400); }
        .search-input:focus { border-color: var(--black); }
        
        .filter-box {
            padding: 24px 32px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }
        
        .filter-btn {
            padding: 8px 16px;
            border: 1px solid var(--gray-200);
            background: transparent;
            font-family: 'DM Sans', sans-serif;
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--gray-600);
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .filter-btn:hover {
            border-color: var(--black);
            color: var(--black);
        }
        
        .filter-btn.active {
            background: var(--black);
            border-color: var(--black);
            color: var(--white);
        }
        
        /* Main Grid */
        .main {
            display: grid;
            grid-template-columns: 280px 1fr;
        }
        
        .sidebar {
            border-right: 1px solid var(--gray-200);
            padding: 32px;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
        }
        
        .sidebar-title {
            font-size: 10px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--gray-400);
            margin-bottom: 24px;
        }
        
        .cat-nav {
            list-style: none;
        }
        
        .cat-nav-item {
            padding: 12px 0;
            border-bottom: 1px solid var(--gray-100);
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .cat-nav-item:hover { padding-left: 8px; }
        
        .cat-nav-item.active {
            font-weight: 500;
        }
        
        .cat-nav-num {
            font-size: 10px;
            letter-spacing: 0.1em;
            color: var(--gray-400);
            margin-right: 12px;
        }
        
        .cat-nav-name {
            font-size: 13px;
        }
        
        .cat-nav-count {
            float: right;
            font-size: 11px;
            color: var(--gray-400);
        }
        
        /* Content */
        .content {
            padding: 0;
        }
        
        .category-section {
            border-bottom: 1px solid var(--gray-200);
        }
        
        .category-header {
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: end;
            padding: 48px 48px 32px;
            border-bottom: 1px solid var(--gray-100);
        }
        
        .category-num {
            font-size: 10px;
            letter-spacing: 0.15em;
            color: var(--gray-400);
            margin-bottom: 8px;
        }
        
        .category-title {
            font-size: 28px;
            font-weight: 400;
            letter-spacing: -0.02em;
        }
        
        .category-count {
            font-size: 11px;
            letter-spacing: 0.1em;
            color: var(--gray-400);
            text-transform: uppercase;
        }
        
        .tips-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
        }
        
        .tip-card {
            padding: 32px 48px;
            border-bottom: 1px solid var(--gray-100);
            border-right: 1px solid var(--gray-100);
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .tip-card:nth-child(2n) { border-right: none; }
        
        .tip-card:hover { background: var(--off-white); }
        
        .tip-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        
        .tip-num {
            font-size: 10px;
            letter-spacing: 0.1em;
            color: var(--gray-400);
        }
        
        .tip-arrow {
            font-size: 18px;
            color: var(--gray-400);
            transition: transform 0.2s, color 0.2s;
        }
        
        .tip-card:hover .tip-arrow {
            transform: translateX(4px);
            color: var(--black);
        }
        
        .tip-title {
            font-size: 15px;
            font-weight: 400;
            line-height: 1.6;
        }
        
        .tip-tools {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        
        .tool-tag {
            font-size: 10px;
            letter-spacing: 0.05em;
            padding: 4px 10px;
            background: var(--gray-100);
            color: var(--gray-600);
        }
        
        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10,10,10,0.85);
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        .modal {
            position: fixed;
            top: 0;
            right: 0;
            width: 100%;
            max-width: 640px;
            height: 100%;
            background: var(--black);
            color: var(--white);
            z-index: 1001;
            transform: translateX(100%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
        }
        
        .modal.active { transform: translateX(0); }
        
        .modal-header {
            padding: 48px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .modal-close {
            position: absolute;
            top: 24px;
            right: 24px;
            width: 40px;
            height: 40px;
            border: 1px solid rgba(255,255,255,0.2);
            background: transparent;
            color: var(--white);
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .modal-close:hover {
            background: var(--white);
            color: var(--black);
        }
        
        .modal-meta {
            font-size: 10px;
            letter-spacing: 0.15em;
            color: rgba(255,255,255,0.4);
            text-transform: uppercase;
            margin-bottom: 24px;
        }
        
        .modal-title {
            font-size: 24px;
            font-weight: 400;
            line-height: 1.4;
            margin-bottom: 24px;
            padding-right: 48px;
        }
        
        .modal-tools {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .modal-tools .tool-tag {
            background: rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.7);
        }
        
        .modal-body {
            flex: 1;
            overflow-y: auto;
            padding: 48px;
        }
        
        .modal-section {
            margin-bottom: 40px;
        }
        
        .modal-section:last-child { margin-bottom: 0; }
        
        .modal-label {
            font-size: 10px;
            letter-spacing: 0.15em;
            color: rgba(255,255,255,0.4);
            text-transform: uppercase;
            margin-bottom: 12px;
        }
        
        .modal-text {
            font-size: 14px;
            line-height: 1.9;
            color: rgba(255,255,255,0.8);
        }
        
        .modal-quote {
            margin-top: 48px;
            padding: 32px;
            border-left: 2px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.03);
        }
        
        .modal-quote-text {
            font-size: 14px;
            line-height: 1.8;
            color: rgba(255,255,255,0.7);
            font-style: italic;
        }
        
        .modal-quote-label {
            font-size: 10px;
            letter-spacing: 0.15em;
            color: rgba(255,255,255,0.3);
            text-transform: uppercase;
            margin-top: 16px;
        }
        
        /* Footer */
        .footer {
            padding: 48px;
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--gray-400);
            letter-spacing: 0.05em;
        }
        
        /* Responsive */
        @media (max-width: 1024px) {
            .hero { padding: 24px; }
            .controls { grid-template-columns: 1fr; }
            .search-box { border-right: none; border-bottom: 1px solid var(--gray-200); }
            .main { grid-template-columns: 1fr; }
            .sidebar { display: none; }
            .tips-grid { grid-template-columns: 1fr; }
            .tip-card { border-right: none; }
            .category-header, .tip-card { padding: 24px; }
        }
        
        @media (max-width: 640px) {
            .hero-bottom { gap: 32px; }
            .stat-num { font-size: 32px; }
            .modal { max-width: 100%; }
            .modal-header, .modal-body { padding: 24px; }
        }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--gray-200); }
        .modal-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); }
    </style>
</head>
<body>
    <section class="hero">
        <div class="hero-top">
            <span class="en">DeNA AI Catalog</span>
            <span class="en">2025</span>

        <div class="hero-center">

        <div class="hero-bottom">

            <div class="stat">

            <div class="stat">
                <div class="stat-num en">20+</div>

    <section class="controls">
        <div class="search-box">
            <input type="text" class="search-input" id="searchInput" placeholder="Search...">

    <main class="main">
        <aside class="sidebar">
            <div class="sidebar-title en">Categories</div>

    <footer class="footer">
        <span>© DeNA Co., Ltd.</span>

    <div class="modal-overlay" id="overlay"></div>
    <div class="modal" id="modal">

        <div class="modal-body" id="modalBody"></div>

    { id: 2, cat: 'data', title: 'GoogleドライブでPDF情報を即座に取得', tools: ['Gemini'], challenge: '大量のPDF資料から特定の情報を探し出すのに時間と手間がかかっていた', solution: 'Googleドライブ上のPDFでGeminiを開き、内容に関する具体的な質問を入力', result: '情報収集にかかる時間を大幅に短縮。英文PDFも和訳して回答してくれる', voice: 'ページ数が多いPDF資料の中から、必要な情報を瞬時に見つけられるようになりました' },
    { id: 3, cat: 'coding', title: 'GitHub Copilotでコードレビュー自動化', tools: ['GitHub Copilot'], challenge: '手動でのコードレビューは時間と労力がかかり、開発のボトルネックになっていた', solution: 'GitHub Copilot code reviewを使った自動PRレビューを実施', result: 'PoC段階だが、精度は業務利用に十分なレベル', voice: 'コードの品質向上とレビュー担当者の負担軽減につながると感じています' },
    { id: 4, cat: 'coding', title: 'プログラミング知識ゼロからChrome拡張を開発', tools: ['生成AI'], challenge: 'セキュリティ要件を満たすOGP画像表示ツールが必要だったが、既存ツールでは対応できなかった', solution: '生成AIに機能要件とセキュリティ要望を伝え、Chrome拡張機能を開発依頼', result: 'エンジニアレビュー後、必要な画像テストを安全に実施できるようになった', voice: 'セキュリティに配慮しつつ、必要な機能を備えたツールを自作できました！' },

// フィルタ生成
const filtersEl = document.getElementById('filters');
[{ id: 'all', name: 'ALL' }, ...cats].forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn en' + (cat.id === 'all' ? ' active' : '');
    btn.dataset.category = cat.id;
    btn.textContent = cat.name;
    filtersEl.appendChild(btn);
});

// サイドバー生成
const catNavEl = document.getElementById('catNav');
cats.forEach((cat, i) => {
    const count = tips.filter(t => t.cat === cat.id).length;
    const li = document.createElement('li');
    li.className = 'cat-nav-item';
    li.dataset.category = cat.id;
    li.innerHTML = `<span class="cat-nav-num en">${String(i + 1).padStart(2, '0')}</span><span class="cat-nav-name">${cat.name}</span><span class="cat-nav-count en">${count}</span>`;
    catNavEl.appendChild(li);
});

// コンテンツ生成
const contentEl = document.getElementById('content');
cats.forEach((cat, i) => {
    const catTips = tips.filter(t => t.cat === cat.id);
    const section = document.createElement('section');
    section.className = 'category-section';
    section.dataset.category = cat.id;
    section.innerHTML = `
        <div class="category-header">
            <div>
                <div class="category-num en">${String(i + 1).padStart(2, '0')}. ${cat.nameEn.toUpperCase()}</div>
                <h2 class="category-title">${cat.name}</h2>
            </div>
            <div class="category-count en">${catTips.length} Cases</div>
        </div>
        <div class="tips-grid">
            ${catTips.map(tip => `
                <div class="tip-card" data-id="${tip.id}">
                    <div class="tip-top">
                        <span class="tip-num en">${String(tip.id).padStart(3, '0')}</span>
                        <span class="tip-arrow">→</span>
                    </div>
                    <div class="tip-title">${tip.title}</div>
                    <div class="tip-tools">${tip.tools.map(t => `<span class="tool-tag en">${t}</span>`).join('')}</div>
                </div>
            `).join('')}
        </div>
    `;
    contentEl.appendChild(section);
});

// フィルタ
document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const cat = btn.dataset.category;
        document.querySelectorAll('.category-section').forEach(s => {
            s.style.display = (cat === 'all' || s.dataset.category === cat) ? 'block' : 'none';
        });
    });
});

// サイドバークリック
document.querySelectorAll('.cat-nav-item').forEach(item => {
    item.addEventListener('click', () => {
        const cat = item.dataset.category;
        document.querySelector(`.category-section[data-category="${cat}"]`)?.scrollIntoView({ behavior: 'smooth' });
    });
});

// 検索
document.getElementById('searchInput').addEventListener('input', (e) => {
    const term = e.target.value.toLowerCase();
    document.querySelectorAll('.tip-card').forEach(card => {
        const title = card.querySelector('.tip-title').textContent.toLowerCase();
        const tools = card.querySelector('.tip-tools').textContent.toLowerCase();
        card.style.display = (title.includes(term) || tools.includes(term)) ? 'flex' : 'none';
    });
    document.querySelectorAll('.category-section').forEach(section => {
        const hasVisible = section.querySelector('.tip-card[style="display: flex;"], .tip-card:not([style])');
        section.style.display = hasVisible ? 'block' : 'none';
    });
});

// モーダル
const overlay = document.getElementById('overlay');
const modal = document.getElementById('modal');
const close = () => { overlay.classList.remove('active'); modal.classList.remove('active'); };
overlay.addEventListener('click', close);
document.getElementById('closeBtn').addEventListener('click', close);
document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });

document.querySelectorAll('.tip-card').forEach(card => {
    card.addEventListener('click', () => {
        const id = parseInt(card.dataset.id);
        const tip = tips.find(t => t.id === id);
        if (!tip) return;
        const cat = cats.find(c => c.id === tip.cat);
        document.getElementById('modalMeta').textContent = `No. ${String(tip.id).padStart(3, '0')} — ${cat.nameEn}`;
        document.getElementById('modalTitle').textContent = tip.title;
        document.getElementById('modalTools').innerHTML = tip.tools.map(t => `<span class="tool-tag en">${t}</span>`).join('');
        document.getElementById('modalBody').innerHTML = `
            <div class="modal-section"><div class="modal-label en">Challenge</div><div class="modal-text">${tip.challenge}</div></div>
            <div class="modal-section"><div class="modal-label en">Solution</div><div class="modal-text">${tip.solution}</div></div>
            <div class="modal-section"><div class="modal-label en">Result</div><div class="modal-text">${tip.result}</div></div>
            <div class="modal-quote"><div class="modal-quote-text">${tip.voice}</div><div class="modal-quote-label en">User Voice</div></div>
        `;
        overlay.classList.add('active');
        modal.classList.add('active');
    });
});
</script>
</body>
